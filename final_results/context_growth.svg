<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <rect width="1200" height="620" fill="#ffffff"/>
  <text x="600" y="38" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#1f2937">Context Growth Still Rises With Hop Depth</text>
  <text x="600" y="62" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#4b5563">Average context token count per IRCoT generation hop from the saved dense run</text>

  <!-- chart area -->
  <line x1="110" y1="520" x2="1110" y2="520" stroke="#111827" stroke-width="2"/>
  <line x1="110" y1="90" x2="110" y2="520" stroke="#111827" stroke-width="2"/>

  <!-- grid -->
  <line x1="110" y1="460" x2="1110" y2="460" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="6 5"/>
  <line x1="110" y1="360" x2="1110" y2="360" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="6 5"/>
  <line x1="110" y1="260" x2="1110" y2="260" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="6 5"/>
  <line x1="110" y1="160" x2="1110" y2="160" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="6 5"/>

  <!-- y labels -->
  <text x="84" y="524" text-anchor="end" font-family="Arial" font-size="12" fill="#374151">700</text>
  <text x="84" y="464" text-anchor="end" font-family="Arial" font-size="12" fill="#374151">900</text>
  <text x="84" y="364" text-anchor="end" font-family="Arial" font-size="12" fill="#374151">1100</text>
  <text x="84" y="264" text-anchor="end" font-family="Arial" font-size="12" fill="#374151">1300</text>
  <text x="84" y="164" text-anchor="end" font-family="Arial" font-size="12" fill="#374151">1500</text>

  <text x="36" y="310" transform="rotate(-90 36 310)" font-family="Arial" font-size="13" fill="#374151">Average context tokens</text>

  <!-- x labels -->
  <text x="220" y="552" text-anchor="middle" font-family="Arial" font-size="13" fill="#111827">Hop 1</text>
  <text x="440" y="552" text-anchor="middle" font-family="Arial" font-size="13" fill="#111827">Hop 2</text>
  <text x="660" y="552" text-anchor="middle" font-family="Arial" font-size="13" fill="#111827">Hop 3</text>
  <text x="880" y="552" text-anchor="middle" font-family="Arial" font-size="13" fill="#111827">Hop 4</text>

  <!-- line: approximate averages from the saved plot -->
  <polyline points="220,473 440,351 660,269 880,208" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="220" cy="473" r="6" fill="#2563eb"/>
  <circle cx="440" cy="351" r="6" fill="#2563eb"/>
  <circle cx="660" cy="269" r="6" fill="#2563eb"/>
  <circle cx="880" cy="208" r="6" fill="#2563eb"/>

  <text x="220" y="455" text-anchor="middle" font-family="Arial" font-size="12" fill="#111827">~730</text>
  <text x="440" y="333" text-anchor="middle" font-family="Arial" font-size="12" fill="#111827">~1045</text>
  <text x="660" y="251" text-anchor="middle" font-family="Arial" font-size="12" fill="#111827">~1205</text>
  <text x="880" y="190" text-anchor="middle" font-family="Arial" font-size="12" fill="#111827">~1357</text>

  <!-- callout -->
  <rect x="940" y="110" width="190" height="112" rx="16" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="1035" y="140" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1d4ed8">Key observation</text>
  <text x="1035" y="166" text-anchor="middle" font-family="Arial" font-size="13" fill="#1f2937">Context grows steadily</text>
  <text x="1035" y="188" text-anchor="middle" font-family="Arial" font-size="13" fill="#1f2937">from hop 1 to hop 4.</text>
  <text x="1035" y="210" text-anchor="middle" font-family="Arial" font-size="13" fill="#1f2937">That is the pressure</text>
  <text x="1035" y="232" text-anchor="middle" font-family="Arial" font-size="13" fill="#1f2937">SPIRE is designed to reduce.</text>

  <text x="610" y="602" text-anchor="middle" font-family="Arial" font-size="12" fill="#4b5563">Dense IRCoT and SPIRE share the same growth pattern because both keep prior hops in context; the difference is how attention budget is allocated.</text>
</svg>